name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "1"
      - name: Build the store packages
        run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: forreal-builds
          path: dist/*.zip
          if-no-files-found: error
