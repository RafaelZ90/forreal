<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ForReal classifier tests</title>
<style>
  body { font: 13px/1.4 -apple-system, system-ui, sans-serif; margin: 20px; }
  table { border-collapse: collapse; width: 100%; } td, th { border-bottom: 1px solid #ddd; padding: 4px 6px; text-align: left; vertical-align: top; }
  .fail { background: #fde8e8; } .pass { background: #e8f6ec; } #sum { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="sum">running…</div>
<table><thead><tr><th>fixture</th><th>category</th><th>signal / tier</th><th>roast</th><th>worth</th><th>text</th></tr></thead><tbody id="rows"></tbody></table>
<script src="../src/content/classifier.js"></script>
<script src="../src/content/policy.js"></script>
<script src="fixtures/demo-posts.js"></script>
<script src="checks.js"></script>
<script>
// The same fixture lists and checks as `npm test` (test/node/classifier.test.mjs), drawn as a table.
const FIXTURES = ["demo-posts.js (LinkedIn)", "demo-posts.js (X)", "fixtures/bsky-style.json", "fixtures/regressions.json",
  "fixtures/worth-it.json", "fixtures/junk.json", "fixtures/german.json"];
(async () => {
  let pass = 0, fail = 0, total = 0;
  const rows = document.getElementById("rows");
  for (const f of FIXTURES) {
    let list;
    if (f.includes("LinkedIn")) list = UnspinChecks.fromDemo(window.DEMO_LI);
    else if (f.includes("(X)")) list = UnspinChecks.fromDemo(window.DEMO_X);
    else try { list = await (await fetch(f)).json(); } catch (e) { continue; }
    for (const p of list) {
      total++;
      const { v, tier, folds, ok, why } = UnspinChecks.check(Unspin, p);
      if (ok === true) pass++; if (ok === false) fail++;
      const tr = document.createElement("tr");
      tr.className = ok === false ? "fail" : ok ? "pass" : "";
      [f.replace("fixtures/", ""), v.category + (why.length ? " (" + why.join("; ") + ")" : ""), v.signal + " " + tier + (folds ? " folded" : ""), v.roast, v.worth ? v.worth.title : "", p.text.slice(0, 110)]
        .forEach((c) => { const td = document.createElement("td"); td.textContent = c; tr.appendChild(td); });
      rows.appendChild(tr);
    }
  }
  document.getElementById("sum").textContent = (fail ? "FAIL" : "PASS") + ": " + pass + " passed, " + fail + " failed, " + (total - pass - fail) + " unchecked";
  window.__result = { pass, fail, total };
})();
</script>
</body>
</html>
