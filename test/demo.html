<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForReal demo feed</title>
<style>
  body { margin: 0; font: 14px/1.42 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background: #f4f2ee; color: rgba(0,0,0,.9); }
  .bar { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid #e0dfdc; padding: 10px 20px; display: flex; gap: 14px; align-items: center; }
  .bar b { font-size: 15px; } .bar a { color: #0a66c2; font-size: 13px; }
  .cols { display: grid; grid-template-columns: minmax(0, 555px) minmax(0, 600px); gap: 28px; justify-content: center; padding: 20px 16px; }
  @media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 600px); } }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #666; margin: 0 0 8px; }
  /* LinkedIn-like column */
  .li .feed-shared-update-v2 { background: #fff; border-radius: 8px; box-shadow: 0 0 0 1px rgba(140,140,140,.2); margin-bottom: 8px; padding: 12px 0 8px; }
  .li .update-components-actor { display: flex; gap: 8px; padding: 0 16px 8px; }
  .li .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg,#9db4c8,#5c7c99); flex: none; }
  .li .update-components-actor__title { font-weight: 600; font-size: 14px; }
  .li .update-components-actor__description, .li .update-components-actor__sub-description { font-size: 12px; color: rgba(0,0,0,.6); }
  .li .update-components-text { padding: 0 16px; white-space: pre-wrap; }
  .li .update-components-text a { color: #0a66c2; font-weight: 600; text-decoration: none; }
  .li .social { display: flex; justify-content: space-around; border-top: 1px solid #e8e8e8; margin: 10px 16px 0; padding-top: 6px; color: rgba(0,0,0,.6); font-weight: 600; font-size: 13px; }
  .li .update-components-article { margin: 10px 0 0; background: #eef3f8; padding: 10px 16px; }
  .li .update-components-article a { color: inherit; text-decoration: none; }
  .li .update-components-article__title { font-weight: 600; }
  /* X-like column */
  .xcol { background: #000; color: #e7e9ea; border: 1px solid #2f3336; border-radius: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; }
  .xcol article { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #2f3336; }
  .xcol .av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg,#444,#888); flex: none; }
  .xcol .body { min-width: 0; flex: 1; }
  .xcol [data-testid="User-Name"] { font-weight: 700; } .xcol [data-testid="User-Name"] span { color: #71767b; font-weight: 400; }
  .xcol [data-testid="tweetText"] { white-space: pre-wrap; margin-top: 2px; }
  .xcol a { color: #1d9bf0; text-decoration: none; }
  .xcol [data-testid="card.wrapper"] { border: 1px solid #2f3336; border-radius: 16px; margin-top: 10px; padding: 10px 12px; }
  .xcol .icons { color: #71767b; font-size: 13px; margin-top: 10px; display: flex; gap: 48px; }
</style>
</head>
<body>
<div class="bar"><b>Unspin demo feed</b><span>made-up posts, local decoder</span>
  <a href="?spice=mild">mild</a><a href="?spice=snarky">snarky</a><a href="?spice=savage">savage</a><a href="?collapse=never">show originals</a></div>
<div class="cols">
<section class="li" data-unspin-site="linkedin" id="li"><h3>LinkedIn-style feed</h3></section>
<section data-unspin-site="x"><h3>X-style feed</h3><div class="xcol" id="xf"></div></section>
</div>

<script src="fixtures/demo-posts.js"></script>
<script>
// ?many=N repeats the feeds N times (performance checks); each copy's text differs so each is judged on its own.
const MANY = Math.max(1, Math.min(100, Number(new URLSearchParams(location.search).get("many")) || 1));
const rep = (list) => Array.from({ length: MANY }, (_, k) => list.map((p) => (k ? Object.assign({}, p, { t: p.t + "\n\n(copy " + k + ")" }) : p))).flat();
const LI = rep(window.DEMO_LI), X = rep(window.DEMO_X);
const li = document.getElementById("li");
LI.forEach((p, i) => {
  const el = document.createElement("div");
  el.className = "feed-shared-update-v2";
  el.setAttribute("data-urn", "urn:li:activity:" + (7000 + i));
  el.innerHTML = `<div class="update-components-actor"><div class="avatar"></div><div><div class="update-components-actor__title"><span aria-hidden="true"></span></div><div class="update-components-actor__description"></div><div class="update-components-actor__sub-description"></div></div></div><div class="update-components-text"><span dir="ltr"></span></div><div class="social"><span>Like</span><span>Comment</span><span>Repost</span><span>Send</span></div>`;
  el.querySelector("[aria-hidden]").textContent = p.a;
  el.querySelector(".update-components-actor__description").textContent = p.promoted ? "" : p.d;
  el.querySelector(".update-components-actor__sub-description").textContent = p.promoted ? "Promoted" : (i + 2) + "h • 🌐";
  const span = el.querySelector("span[dir]");
  span.textContent = p.t;
  if (p.link) { const a = document.createElement("a"); a.href = p.link.href; a.textContent = p.link.text; span.appendChild(a); }
  li.appendChild(el);
});
const xf = document.getElementById("xf");
X.forEach((p) => {
  const el = document.createElement("article");
  el.setAttribute("data-testid", "tweet");
  el.innerHTML = `<div class="av"></div><div class="body"><div data-testid="User-Name"></div><div><div data-testid="tweetText" dir="auto"></div></div><div class="icons"><span>💬 12</span><span>🔁 40</span><span>♥ 310</span></div></div>`;
  el.querySelector("[data-testid=User-Name]").innerHTML = "";
  el.querySelector("[data-testid=User-Name]").append(p.a + " ", Object.assign(document.createElement("span"), { textContent: p.h + " · 3h" }));
  el.querySelector("[data-testid=tweetText]").textContent = p.t;
  if (p.card) {
    const c = document.createElement("div");
    c.setAttribute("data-testid", "card.wrapper");
    c.innerHTML = `<a><span></span></a>`;
    c.querySelector("a").href = p.card.href;
    c.querySelector("span").textContent = p.card.title;
    el.querySelector(".body").insertBefore(c, el.querySelector(".icons"));
  }
  xf.appendChild(el);
});
</script>
<script src="shim.js"></script>
<script src="../src/defaults.js"></script>
<script src="../src/content/classifier.js"></script>
<script src="../src/content/policy.js"></script>
<script src="../src/content/sites.js"></script>
<script src="../src/content/overlay.js"></script>
<script src="../src/content/main.js"></script>
<script src="selftest.js"></script>
</body>
</html>
